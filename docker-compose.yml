services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vaultx
      POSTGRES_USER: vaultx
      POSTGRES_PASSWORD: vaultx-dev
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/vaultx-dev
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4jdata:/data]
volumes:
  pgdata:
  neo4jdata:
