<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vaultGradient" x1="50" y1="50" x2="130" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="borderGradient" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="6" y="6" width="168" height="168" rx="38" fill="#090d16" stroke="url(#borderGradient)" stroke-width="4"/>
  
  <!-- Stylized V for VaultX -->
  <path d="M 52 54 L 90 126 L 128 54" 
        stroke="url(#vaultGradient)" 
        stroke-width="22" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />
</svg>